    <title>璀璨圣诞树 · Merry Christmas</title>
    <!-- Tailwind CSS is bundled locally via @tailwindcss/vite; MediaPipe scripts load on-demand -->
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #070b18;
        font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', 'Microsoft YaHei', serif;
      }
      canvas {
        touch-action: none;
      }
      .font-display {
        font-family: 'Playfair Display', 'Songti SC', 'STSong', 'SimSun', serif;
      }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,217,138,0.35); border-radius: 2px; }
      @keyframes shimmer {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      .shimmer { animation: shimmer 3s ease-in-out infinite; }
      @keyframes snowfall-gradient {
        0% { background-position: 0% 0%; }
        100% { background-position: 0% 200%; }
      }
    </style>
    <!-- 摄像头诊断：微信/QQ 内置浏览器没有 getUserMedia，直接给可读提示 -->
    <script>
      (function () {
        var shown = false;
        function tip(msg) {
          if (shown) return;
          shown = true;
          var d = document.createElement('div');
          d.style.cssText = 'position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:99999;' +
            'max-width:88vw;padding:12px 16px;border-radius:14px;font:14px/1.65 system-ui,"Microsoft YaHei",sans-serif;' +
            'background:rgba(40,14,14,.95);color:#ffe0b8;border:1px solid rgba(255,140,120,.55);' +
            'box-shadow:0 10px 34px rgba(0,0,0,.55);cursor:pointer;text-align:left';
          d.textContent = msg + '（点此关闭）';
          d.onclick = function () { d.remove(); shown = false; };
          (document.body || document.documentElement).appendChild(d);
        }
        window.__CT_TIP__ = tip;

        var md = navigator.mediaDevices;
        if (!md || typeof md.getUserMedia !== 'function') {
          // 装上「占位实现」：有的浏览器（微信/QQ 内置、部分安卓 WebView）根本没有
          // mediaDevices，页面其它逻辑会因此直接崩掉，所以这里补一个只会失败的空壳。
          var stub = {
            getUserMedia: function () {
              return Promise.reject(new DOMException('camera unsupported', 'NotSupportedError'));
            },
            getDisplayMedia: function () {
              return Promise.reject(new DOMException('camera unsupported', 'NotSupportedError'));
            },
            enumerateDevices: function () { return Promise.resolve([]); },
            addEventListener: function () {}, removeEventListener: function () {},
            dispatchEvent: function () { return true; }
          };
          try {
            Object.defineProperty(navigator, 'mediaDevices', {
              configurable: true, enumerable: true, writable: true, value: stub
            });
          } catch (e) { try { navigator.mediaDevices = stub; } catch (e2) {} }
          document.addEventListener('DOMContentLoaded', function () {
            tip('这个浏览器不支持调用摄像头（微信 / QQ 内置浏览器里常见）。请点右上角「…」→「在浏览器中打开」，用 Safari 或 Chrome 再看');
          });
          return;
        }
        var orig = md.getUserMedia.bind(md);
        navigator.mediaDevices.getUserMedia = function (c) {
          // 强制前置摄像头 + 合适分辨率：安卓上默认可能开成后置，画面里没有手，
          // 表现就是「一直手势识别中但没反应」。
          var cc = c;
          try {
            if (c && c.video) {
              var v = (typeof c.video === 'object' && c.video) ? c.video : {};
              if (!v.deviceId) {
                cc = Object.assign({}, c, {
                  video: Object.assign({}, v, {
                    facingMode: { ideal: 'user' },
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                  })
                });
              }
            }
          } catch (e) {}
          return orig(cc).catch(function (e) {
            var n = (e && e.name) || '未知错误';
            var msg = n === 'NotAllowedError'
              ? '摄像头权限被拒绝了。请在浏览器/系统里允许本页面使用摄像头，然后刷新重试'
              : n === 'NotFoundError'
                ? '没找到可用的摄像头'
                : '摄像头打不开（' + n + '）。如果是微信里打开的，请改用 Safari / Chrome';
            tip(msg);
            throw e;
          });
        };

        // 手势状态看门狗：页面里有 window.__gestureDiag = {frames,results,noHand,...}
        // 三种情况分别给提示：引擎卡死 / 认不出手 / 认出上手怎么玩
        var hintShown = false, stallShown = false, diagSince = 0;
        setInterval(function () {
          var d = window.__gestureDiag;
          if (!d) { diagSince = 0; return; }
          if (!diagSince) diagSince = Date.now();
          var elapsed = Date.now() - diagSince;

          // 收到画面但一帧都没算完 → send() 卡住（微信/WKWebView 里常见）
          if (!stallShown && d.frames >= 1 && d.results === 0 && elapsed > 10000) {
            stallShown = true;
            tip('手势引擎卡住了：画面进来了，但一帧都没算完。这通常是微信内置浏览器的限制——点右上角「…」→「在浏览器中打开」，用 Safari 再试');
            return;
          }
          if (!d.results || d.results < 15 || hintShown) return;
          var ratio = d.noHand / d.results;
          if (ratio > 0.95) {
            hintShown = true;
            tip('镜头里看到画面，但没认出你的手：把手退到离镜头 30~50 厘米，让手腕到指尖整只手都在框里，别背光，五指张开停 1 秒');
          } else {
            hintShown = true;
            tip('已检测到手 ✓：五指张开 或 拇指食指捏合 → 星光绽放；其它姿势是悬停，指尖位置牵引星光');
          }
        }, 1500);

        // ?diag 诊断浮层：把 MediaPipe 的实时计数和 video 状态打在屏幕上，
        // 方便一眼看出是「没检测到手」还是「画面根本没在走」。
        if (/[?&]diag\b/.test(location.search)) {
          var box = document.createElement('div');
          box.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99998;padding:8px 10px;' +
            'border-radius:10px;font:11px/1.5 ui-monospace,Consolas,monospace;white-space:pre;' +
            'background:rgba(0,0,0,.78);color:#8ef0b0;border:1px solid rgba(120,255,180,.35);pointer-events:none';
          document.addEventListener('DOMContentLoaded', function () {
            document.body.appendChild(box);
            setInterval(function () {
              var d = window.__gestureDiag || {};
              var v = document.querySelector('video');
              var lines = [
                'diag  ' + (window.__gestureDiag ? 'on' : 'off(点手势按钮)'),
                'frames ' + (d.frames || 0) + '   results ' + (d.results || 0),
                'noHand ' + (d.noHand || 0) + '   sendErr ' + (d.sendErrors || 0),
                'hand   ' + (d.results ? (100 - Math.round((d.noHand || 0) * 100 / d.results)) + '% 检测到' : '-'),
                'video  ' + (v ? (v.videoWidth + 'x' + v.videoHeight + ' rs' + v.readyState + (v.paused ? ' PAUSED' : ' play')) : 'none'),
                'dpr ' + window.__CT_CAP__ + '  gpu ' + window.__CT_GPU__
              ];
              if (d.lastError) lines.push('err ' + String(d.lastError).slice(0, 40));
              box.textContent = lines.join('\n');
            }, 700);
          });
        }
      })();
    </script>

    <!-- 性能补丁 1：限制渲染像素比（高分屏 150% 缩放会渲染 1.5 倍像素，很吃显卡） -->
    <!-- 性能补丁 2：探测显卡；软件渲染（没开硬件加速 / 远程桌面 / 虚拟显示器）自动切省电模式 -->
    <!-- 性能补丁 3：进场后自动测帧，烫手就逐级降分辨率（1.25 → 0.9 → 0.75） -->
    <script>
      (function () {
        var software = false;
        try {
          var c = document.createElement('canvas');
          var gl = c.getContext('webgl2') || c.getContext('webgl');
          if (gl) {
            var dbg = gl.getExtension('WEBGL_debug_renderer_info');
            var r = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
            if (/swiftshader|software|basic render|llvmpipe|mesa offscreen|microsoft basic/i.test(String(r))) {
              software = true;
            }
            var lose = gl.getExtension('WEBGL_lose_context');
            if (lose) lose.loseContext();
          } else {
            software = true;
          }
        } catch (e) { software = false; }

        window.__CT_LITE__ = software;
        window.__CT_GPU__ = software ? 'software' : 'hardware';

        var real = window.devicePixelRatio || 1;
        window.__CT_CAP__ = software ? 1 : Math.min(real, 1.25);

        try {
          Object.defineProperty(window, 'devicePixelRatio', {
            configurable: true,
            get: function () { return window.__CT_CAP__; }
          });
        } catch (e) { /* 忽略 */ }

        function setCap(v) {
          if (v >= window.__CT_CAP__) return;
          window.__CT_CAP__ = v;
          try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }

        function probe(ms, cb) {
          var t0 = performance.now(), last = t0, sum = 0, n = 0;
          (function f(now) {
            var dt = now - last; last = now;
            if (dt > 0 && dt < 400) { sum += dt; n++; }
            if (now - t0 < ms) requestAnimationFrame(f);
            else cb(sum / Math.max(1, n));
          })(performance.now());
        }

        window.addEventListener('load', function () {
          if (software) {
            var tip = document.createElement('div');
            tip.style.cssText = 'position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99999;' +
              'max-width:560px;padding:10px 14px;border-radius:12px;font:13px/1.6 system-ui,"Microsoft YaHei";' +
              'background:rgba(30,12,12,.92);color:#ffd9a0;border:1px solid rgba(255,120,120,.5);' +
              'box-shadow:0 8px 30px rgba(0,0,0,.5);cursor:pointer';
            tip.textContent = '⚠ 检测到浏览器在用「软件渲染」（没吃到显卡），画面会很卡。点这里看解决办法';
            tip.title = '点一下关闭';
            tip.onclick = function () { tip.remove(); };
            document.body.appendChild(tip);
          }

          setTimeout(function () {
            probe(2200, function (avg1) {
              if (avg1 > 26) {
                setCap(0.9);
                probe(1800, function (avg2) { if (avg2 > 26) setCap(0.75); });
              }
            });
          }, 2600);
        });
      })();
    </script>
