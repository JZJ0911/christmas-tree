    <script>
      (function () {

    <!-- 鎽勫儚澶磋瘖鏂細寰俊/QQ 鍐呯疆娴忚鍣ㄦ病鏈?getUserMedia锛岀洿鎺ョ粰鍙鎻愮ず -->

      (function () {

            tip('杩欎釜娴忚鍣ㄤ笉鏀寔璋冪敤鎽勫儚澶达紙寰俊 / QQ 鍐呯疆娴忚鍣ㄩ噷甯歌锛夈€傝鐐瑰彸涓婅銆屸€︺€嶁啋銆屽湪娴忚鍣ㄤ腑鎵撳紑銆嶏紝鐢?Safari 鎴?Chrome 鍐嶇湅');

        };

        // ---------------------------------------------------------------
        // 澶囩敤銆屾尌鎵嬫ā寮忋€嶏細涓嶄緷璧?MediaPipe锛岀敤鎽勫儚澶寸敾闈㈢殑杩愬姩閲忓垽鏂尌鎵嬶紝

          if (window.__CT_MOTION_ON) return;
          window.__CT_MOTION_ON = true;

                document.body.appendChild(ownVideo);
                ownVideo.play().catch(function () {});

              .catch(function (e) { tip('鎽勫儚澶存墦涓嶅紑锛? + ((e && e.name) || '鏈煡') + '锛夛紝鎸ユ墜妯″紡鐢ㄤ笉浜嗭紝鍙互鐩存帴鐢ㄦ墜鎸囨嫋鍔ㄦ棆杞?); });

            var best = null, bestArea = 0;
            var all = document.querySelectorAll('canvas');
            for (var i = 0; i < all.length; i++) {
              var r = all[i].getBoundingClientRect();
              var a = r.width * r.height;

            }

          }

          function fire(type, rx, ry, buttons) {
            var el = bigCanvas();
            if (!el) return;
            var r = el.getBoundingClientRect();
            var ev;
            try {
              ev = new PointerEvent(type, {

                clientX: r.left + rx * r.width, clientY: r.top + ry * r.height,

            if (type === 'pointerup') { try { el.releasePointerCapture(77); } catch (e) {} }
          }

                  // energy 灏辨槸銆岀敾闈㈤噷鏈夊澶ф瘮渚嬪湪鍔ㄣ€嶏紝鍗曚綅鏄櫨鍒嗘瘮銆?                  var hits = 0, wx = 0, wsum = 0;

                      var px = (i / 4) % cw;
                      wx += d * px; wsum += d;
                    }

                  if (wsum > 1) cxr = 1 - (wx / wsum) / cw; // 闀滃儚锛屽拰鍓嶇疆鎽勫儚澶翠竴鑷?                }

          } else {
            hintShown = true;
            tip('宸叉娴嬪埌鎵?鉁擄細浜旀寚寮犲紑 鎴?鎷囨寚椋熸寚鎹忓悎 鈫?鏄熷厜缁芥斁锛涘叾瀹冨Э鍔挎槸鎮仠锛屾寚灏栦綅缃壍寮曟槦鍏?);
