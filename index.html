    <style>

    <!-- 性能补丁 1：限制渲染像素比（高分屏 150% 缩放会渲染 1.5 倍像素，很吃显卡） -->
    <!-- 性能补丁 2：探测显卡；软件渲染（没开硬件加速 / 远程桌面 / 虚拟显示器）自动切省电模式 -->
    <!-- 性能补丁 3：进场后自动测帧，烫手就逐级降分辨率（1.25 → 0.9 → 0.75） -->
    <script>
      (function () {
        var software = false;
        try {
          var c = document.createElement('canvas');
          var gl = c.getContext('webgl2') || c.getContext('webgl');
          if (gl) {
            var dbg = gl.getExtension('WEBGL_debug_renderer_info');
            var r = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
            if (/swiftshader|software|basic render|llvmpipe|mesa offscreen|microsoft basic/i.test(String(r))) {
              software = true;
            }
            var lose = gl.getExtension('WEBGL_lose_context');
            if (lose) lose.loseContext();
          } else {
            software = true;
          }
        } catch (e) { software = false; }

        window.__CT_LITE__ = software;
        window.__CT_GPU__ = software ? 'software' : 'hardware';

        var real = window.devicePixelRatio || 1;
        window.__CT_CAP__ = software ? 1 : Math.min(real, 1.25);

        try {
          Object.defineProperty(window, 'devicePixelRatio', {
            configurable: true,
            get: function () { return window.__CT_CAP__; }
          });
        } catch (e) { /* 忽略 */ }

        function setCap(v) {
          if (v >= window.__CT_CAP__) return;
          window.__CT_CAP__ = v;
          try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }

        function probe(ms, cb) {
          var t0 = performance.now(), last = t0, sum = 0, n = 0;
          (function f(now) {
            var dt = now - last; last = now;
            if (dt > 0 && dt < 400) { sum += dt; n++; }
            if (now - t0 < ms) requestAnimationFrame(f);
            else cb(sum / Math.max(1, n));
          })(performance.now());
        }

        window.addEventListener('load', function () {
          if (software) {
            var tip = document.createElement('div');
            tip.style.cssText = 'position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99999;' +
              'max-width:560px;padding:10px 14px;border-radius:12px;font:13px/1.6 system-ui,"Microsoft YaHei";' +
              'background:rgba(30,12,12,.92);color:#ffd9a0;border:1px solid rgba(255,120,120,.5);' +
              'box-shadow:0 8px 30px rgba(0,0,0,.5);cursor:pointer';
            tip.textContent = '⚠ 检测到浏览器在用「软件渲染」（没吃到显卡），画面会很卡。点这里看解决办法';
            tip.title = '点一下关闭';
            tip.onclick = function () { tip.remove(); };
            document.body.appendChild(tip);
          }

          setTimeout(function () {
            probe(2200, function (avg1) {
              if (avg1 > 26) {
                setCap(0.9);
                probe(1800, function (avg2) { if (avg2 > 26) setCap(0.75); });
              }
            });
          }, 2600);
        });
      })();
    </script>

  <!-- ===== 流星层 ===== -->
<script>
(function () {
  var cfg = window.CT_METEOR = {
    minGap: 16,       // 最短间隔（秒）
    maxGap: 45.0,     // 最长间隔（秒）
    speed: 7.5,        // 基础速度（像素/帧，60fps 基准）
    len: 190,         // 尾迹长度
    hue: 195,         // 冷白偏蓝；改 45 是暖金色
    alpha: 0.9
  };

  var cv = document.createElement('canvas');
  cv.id = 'ct-meteor';
  cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2147482000';
  document.body.appendChild(cv);
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  var stars = [], next = 0, t0 = 0;

  function resize() {
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function spawn() {
    // 横贯天空的长流星：从一侧边缘外进入，几乎水平地掠过天空
    var toLeft = true;   // 固定从右侧飞向左侧
    var y0 = (0.004 + Math.random() * 0.042) * H;      // 高度：紧贴画面最上沿
    var sp = cfg.speed * (0.85 + Math.random() * 0.5);
    var drop = 0.05 + Math.random() * 0.09;            // 略微下沉一点
    stars.push({
      x: toLeft ? (W + 40) : -40,
      y: y0,
      vx: (toLeft ? -1 : 1) * sp,
      vy: sp * drop,
      life: 0,
      ttl: Math.round((W + 120) / sp) + 10,
      len: 320 + Math.random() * 160,
      w: 1.0 + Math.random() * 0.8
    });
  }

  function frame(now) {
    if (!t0) t0 = now;
    var dt = Math.min(2.5, (now - t0) / 16.67);
    t0 = now;

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    if (!next) next = now + (cfg.minGap + Math.random() * (cfg.maxGap - cfg.minGap)) * 1000;
    if (now > next) {
      spawn();
      if (Math.random() < 0.10) setTimeout(spawn, 320 + Math.random() * 400);  // 偶尔连着两颗
      next = now + (cfg.minGap + Math.random() * (cfg.maxGap - cfg.minGap)) * 1000;
    }

    for (var i = stars.length - 1; i >= 0; i--) {
      var s = stars[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.life += dt;
      var k = s.life / s.ttl;
      if (k >= 1 || s.x < -80 || s.x > W + 80) { stars.splice(i, 1); continue; }

      // 渐入（前 18%）+ 渐出（后 30%）
      var fadeIn = k < 0.34 ? k / 0.34 : 1;
      var fadeOut = k > 0.52 ? Math.max(0, (1 - k) / 0.48) : 1;
      var a = cfg.alpha * fadeIn * fadeOut;
      var nx = s.vx / Math.hypot(s.vx, s.vy), ny = s.vy / Math.hypot(s.vx, s.vy);
      var tx = s.x - nx * s.len, ty = s.y - ny * s.len;

      var g = ctx.createLinearGradient(s.x, s.y, tx, ty);
      g.addColorStop(0, 'hsla(' + cfg.hue + ',90%,92%,' + a + ')');
      g.addColorStop(0.35, 'hsla(' + cfg.hue + ',85%,80%,' + (a * 0.45) + ')');
      g.addColorStop(1, 'hsla(' + cfg.hue + ',80%,70%,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = s.w;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();

      // 头部亮点
      var rg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 6);
      rg.addColorStop(0, 'rgba(255,255,255,' + a + ')');
      rg.addColorStop(1, 'rgba(180,220,255,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, 6.2832); ctx.fill();
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.CT_METEOR_DEBUG = { spawn: spawn, stars: stars, fire: function(){ spawn(); } };
  resize(); requestAnimationFrame(frame);
})();
</script>
